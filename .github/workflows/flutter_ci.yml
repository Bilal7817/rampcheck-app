name: Flutter CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        cd rampcheck_flutter
        flutter pub get
    
    - name: Verify formatting
      run: |
        cd rampcheck_flutter
        dart format --set-exit-if-changed . || true
    
    - name: Analyze code
      run: |
        cd rampcheck_flutter
        flutter analyze
    
    - name: Run tests
      run: |
        cd rampcheck_flutter
        flutter test
    
    - name: Build macOS
      run: |
        cd rampcheck_flutter
        flutter build macos --debug

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        cd rampcheck_flutter
        flutter pub get
    
    - name: Build Android APK
      run: |
        cd rampcheck_flutter
        flutter build apk --debug